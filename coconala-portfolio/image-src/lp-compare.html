<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>

.top-title { position:absolute; left:0; top:140px; width:1220px; text-align:center; }
.top-title .eyebrow { display:block; margin-bottom:14px; }

.h2 { font-size:50px; }
.cols { position:absolute; left:90px; top:320px; width:1040px; display:grid; grid-template-columns:1.08fr 1fr; gap:24px; align-items:start; }
.col { padding:30px 34px 22px; }
.col h3 { font-family:var(--mincho); font-weight:600; font-size:32px; text-align:center; padding-bottom:18px; border-bottom:1px solid var(--line); }
.col li { list-style:none; display:flex; align-items:center; gap:16px; min-height:96px; padding:12px 0; border-bottom:1px dashed var(--line); font-size:26px; line-height:1.45; }
.col li:last-child { border-bottom:0; }
.col li .icon { flex:none; width:40px; height:40px; }
.col.us { box-shadow:inset 0 0 0 3px var(--gold); }
.col.us h3 { color:var(--gold); }
.col.us li { font-weight:600; }
.col.wp li { color:var(--ink-soft); }
.col.wp li .icon { stroke:var(--ink-soft); }
.answer { position:absolute; left:90px; top:872px; width:1040px; padding:26px 20px; text-align:center;
  background:linear-gradient(135deg, #b38d4e, #8c6630); color:#fff; border-radius:22px;
  font-family:var(--mincho); font-weight:600; font-size:32px; line-height:1.5; letter-spacing:0.03em; box-shadow:0 14px 34px rgba(120,90,50,0.25); }
.sub-note { position:absolute; left:0; top:1042px; width:1220px; text-align:center; font-size:22px; color:var(--ink-soft); }

</style></head>
<body>

<div class="top-title"><span class="eyebrow">COMPARE</span><h2 class="h2">そのサイト、WordPressが必要ですか？</h2><div class="rule"></div></div>
<div class="cols">
  <div class="col card us"><h3>1ページのホームページ</h3><ul>
    <li><svg class="icon" width="48" height="48" viewBox="0 0 48 48"><path d="M14 6l10 15 10-15M24 21v21M15 26h18M15 33h18"/></svg><span>毎月の保守費用 0円</span></li>
    <li><svg class="icon" width="48" height="48" viewBox="0 0 48 48"><circle cx="24" cy="24" r="18"/><path d="M15 24l6 6 12-12"/></svg><span>システムの更新なし</span></li>
    <li><svg class="icon" width="48" height="48" viewBox="0 0 48 48"><path d="M6 20v8h7l15 9V11l-15 9z"/><path d="M34 18c2 1.5 3 3.5 3 6s-1 4.5-3 6M13 28l3 11h5l-3-11"/></svg><span>お知らせはInstagramで</span></li>
    <li><svg class="icon" width="48" height="48" viewBox="0 0 48 48"><path d="M6 10a4 4 0 0 1 4-4h28a4 4 0 0 1 4 4v18a4 4 0 0 1-4 4H20l-9 8v-8h-1a4 4 0 0 1-4-4z"/><path d="M15 17h18M15 23h11"/></svg><span>変更は必要なときだけ依頼</span></li>
  </ul></div>
  <div class="col card wp"><h3>WordPressのサイト</h3><ul>
    <li><svg class="icon" width="48" height="48" viewBox="0 0 48 48"><path d="M14 6l10 15 10-15M24 21v21M15 26h18M15 33h18"/></svg><span>サーバー代 月1,000円前後</span></li>
    <li><svg class="icon" width="48" height="48" viewBox="0 0 48 48"><rect x="6" y="6" width="15" height="15" rx="3"/><rect x="27" y="6" width="15" height="15" rx="3"/><rect x="6" y="27" width="15" height="15" rx="3"/><path d="M34.5 28v13M28 34.5h13"/></svg><span>システムの更新が必要</span></li>
    <li><svg class="icon" width="48" height="48" viewBox="0 0 48 48"><path d="M10 38l3-10 20-20 7 7-20 20z"/><path d="M29 12l7 7"/></svg><span>自分で更新できる</span></li>
    <li><svg class="icon" width="48" height="48" viewBox="0 0 48 48"><rect x="14" y="14" width="26" height="28" rx="3"/><path d="M10 34H8V6h24v4"/></svg><span>ページを増やしやすい</span></li>
  </ul></div>
</div>
<div class="answer">魅力を伝えてショップへつなぐ1ページなら、<br>シンプルな形で十分です</div>
<p class="sub-note">サイトの住所（ドメイン）の代金は、どちらも別にかかります</p>

</body></html>
