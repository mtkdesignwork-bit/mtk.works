<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>

.top-title { position:absolute; left:0; top:140px; width:1220px; text-align:center; }
.top-title .eyebrow { display:block; margin-bottom:14px; }

.steps { position:absolute; left:60px; width:1100px; display:flex; align-items:stretch; }
.step { flex:1; position:relative; padding:68px 26px 34px; text-align:center; }
.step .no { position:absolute; top:-34px; left:50%; transform:translateX(-50%); width:68px; height:68px; border-radius:50%;
  background:linear-gradient(135deg, #b38d4e, #8c6630); color:#fff; font-family:var(--mincho); font-size:32px; font-weight:600;
  display:flex; align-items:center; justify-content:center; box-shadow:0 8px 18px rgba(120,90,50,0.25); }
.step .icon { width:84px; height:84px; margin:0 auto 18px; display:block; }
.step b { display:block; font-family:var(--mincho); font-weight:600; font-size:31px; line-height:1.45; }
.step small { display:block; margin-top:14px; font-size:22px; line-height:1.6; color:var(--ink-soft); }
.step-arrow { flex:none; width:44px; display:flex; align-items:center; justify-content:center; }
.step-arrow span { width:22px; height:22px; border-top:3px solid var(--gold); border-right:3px solid var(--gold); transform:rotate(45deg); }

.steps { top:470px; }
.foot { position:absolute; left:110px; top:950px; width:1000px; padding:28px 36px; display:flex; align-items:center; gap:22px; font-size:24px; line-height:1.6; }
.foot .icon { flex:none; width:56px; height:56px; }

</style></head>
<body>

<div class="top-title"><span class="eyebrow">FLOW</span><h2 class="h2">ログイン情報を<br>預けるのが不安な方へ</h2><div class="rule"></div></div>
<div class="steps"><div class="step card"><div class="no">1</div><svg class="icon" width="48" height="48" viewBox="0 0 48 48"><rect x="4" y="10" width="40" height="28" rx="3"/><circle cx="16" cy="22" r="5"/><path d="M8 33c1.5-4 4.5-6 8-6s6.5 2 8 6M28 20h10M28 27h10"/></svg><b>開設と本人確認は<br>ご自身で</b><small>振込口座など、<br>ご本人の情報は<br>私は触りません</small></div><div class="step-arrow"><span></span></div><div class="step card"><div class="no">2</div><svg class="icon" width="48" height="48" viewBox="0 0 48 48"><path d="M6 18l4-10h28l4 10"/><path d="M6 18c0 3 2.5 5 6 5s6-2 6-5c0 3 2.5 5 6 5s6-2 6-5c0 3 2.5 5 6 5s6-2 6-5"/><path d="M9 23v19h30V23"/><path d="M20 42V31h8v11"/></svg><b>作っている間も<br>ショップはそのまま</b><small>仕上がりは<br>画面の画像で<br>ご確認いただきます</small></div><div class="step-arrow"><span></span></div><div class="step card"><div class="no">3</div><svg class="icon" width="48" height="48" viewBox="0 0 48 48"><circle cx="15" cy="24" r="8"/><path d="M23 24h19M36 24v7M42 24v5"/></svg><b>納品後に<br>パスワードを変更</b><small>変更すれば、<br>私はログイン<br>できなくなります</small></div></div>
<div class="foot card"><svg class="icon" width="48" height="48" viewBox="0 0 48 48"><rect x="9" y="20" width="30" height="22" rx="3"/><path d="M15 20v-6a9 9 0 0 1 18 0v6M24 29v5"/></svg><span>ログイン情報のやりとりは、ココナラのトークルームの中だけで行います。</span></div>

</body></html>
